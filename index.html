<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixxx Now Playing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif; /* Consistent font family */
            color: #ccc; /* Slightly darker white for all text */
            background-image: url('back.jpg');
            background-size: cover; /* Ensure the image covers the entire page */
            background-position: center; /* Center the image */
            background-repeat: no-repeat; /* Prevent repeating the image */
            height: 100vh; /* Full viewport height */
            display: flex;
            flex-direction: column; /* stack header above content */
            overflow: hidden; /* Prevent horizontal scrolling */
        }

        .container {
            display: flex;
            align-items: stretch; /* stretch cards to same height */
            width: 100%;
            flex: 1 1 auto;
            box-sizing: border-box;
            gap: 20px; /* consistent gutter between cards */
            padding: 0 16px 8px 16px;
        }

        #info { display: contents; }

        #dj {
            flex: 1 1 0;
            display: flex;
            flex-direction: column; /* stack image and name vertically */
            align-items: center;
            justify-content: flex-start;
            overflow: hidden; /* keep image inside rounded corners */
        }

        #dj img {
            width: 100%;
            height: 100%;
            max-height: 70vh; /* cap height to keep card balanced */
            object-fit: cover;
            display: block;
            flex: 1 1 auto;
        }

        #dj-name-display {
            margin-top: 12px;
            color: #ccc;
            font-size: 1.05rem;
            text-align: center;
            opacity: 0.95;
        }

        /* Card base styling for track and DJ panels and header */
        .card {
            padding: 12px;
            background: rgba(0, 0, 0, 0.75);
            box-shadow: inset 0 6px 18px rgba(0,0,0,0.55);
            border-radius: 8px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Cards (playing, next, dj) share equal widths */
        .card-column {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
        }

        /* Track cards content */
        .track-lines {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.08);
            flex: 1 1 auto;
        }

        .track-line {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .track-line:last-child {
            border-bottom: none;
        }

        /* Track rows: noticeable but smaller than headings */
        #current-track, #upcoming-track {
            font-size: 1.22rem; /* slightly smaller than before */
            font-weight: 500;
            color: #cfcfcf; /* slightly darker grey than titles */
        }
        th:nth-child(3), td:nth-child(3) {
            /* Ensure the Genre column (third column) is not hidden */
        }

        th:nth-child(3), td:nth-child(3) {
            /* Style the Genre column */
        }

        /* (tables removed in favor of cards) */

        h1, h2 {
            color: #ccc; /* Ensure headers have the same text color as the rest of the page */
        }

        #now-playing, #next-track {
            margin: 0; /* Remove default margin */
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: center; /* center the input across the page */
            margin: 4px 0 8px 0; /* even tighter vertical spacing */
            width: 100%;
        }


        /* Two-line header textarea */
        #header-text {
            width: 100%;
            max-width: 900px;
            padding: 6px 12px; /* tighter padding */
            font-size: 1.4rem; /* slightly smaller to fit */
            font-family: Arial, sans-serif;
            color: #ccc;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25); /* translucent border (less visible than white) */
            border-radius: 6px;
            text-align: center;
            line-height: 1.15;
            resize: none;
            height: auto;
            min-height: 2.8rem; /* smaller two-line height */
            max-height: 5.6rem; /* prevent runaway growth */
            overflow-y: hidden; /* hide scrollbar */
            box-sizing: border-box;
        }

        .playing-gif {
            height: 86px; /* balance between heading prominence and header tightness */
            margin-left: 0;
            margin-right: 10px; /* gap between image (left) and title text */
        }

        /* Emphasize panel headings (bigger than track text) */
        #now-playing h2, #next-track h2 {
            margin: 6px 6px 10px 6px; /* breathing room below title */
            font-size: 1.6rem; /* slightly smaller, still larger than track text */
            font-weight: 400; /* not bold */
            color: #e6e6e6; /* light grey for titles */
            line-height: 1;
            min-height: 96px; /* keep both headings aligned even with the spinning image */
            align-items: center;
            gap: 8px;
        }

        h2 {
            display: flex;
            align-items: center;
        }

        /* Stack cards on narrow screens */
        @media (max-width: 900px) {
            .tracks {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="header" class="card">
        <textarea id="header-text" aria-label="Milonga and DJ name">Milonga ...
DJ. Murat Karakaya KMK</textarea>
    </div>
    <div class="container">
        <div id="now-playing" class="card card-column">
            <h2><img src="playing.gif" alt="Playing" class="playing-gif">Playing</h2>
            <div class="track-lines" id="current-track">Loading...</div>
        </div>
        <div id="next-track" class="card card-column">
            <h2>Next</h2>
            <div class="track-lines" id="upcoming-track">Loading...</div>
        </div>
        <div id="dj" class="card card-column">
            <img src="dj.png" alt="DJ Photo">
            <div id="dj-name-display">DJ. Murat Karakaya KMK</div>
        </div>
    </div>
    <script>
        // Format displayed text: replace underscores with spaces
        function formatText(text) {
            return text ? String(text).replace(/_/g, ' ') : '';
        }
        function fetchData() {
            fetch('/now-playing')
                .then(response => response.json())
                .then(data => {
                    const currentTrackRow = document.getElementById('current-track');
                    currentTrackRow.innerHTML = `
                        <div class="track-line">${formatText(data.Song)}</div>
                        <div class="track-line">${formatText(data.Orquestra)}</div>
                        <div class="track-line">${formatText(data.Genre)}</div>
                        <div class="track-line">${formatText(data.Year)}</div>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('current-track').innerHTML = 'Error loading data';
                });

            fetch('/next-playing')
                .then(response => response.json())
                .then(data => {
                    const nextTrackRow = document.getElementById('upcoming-track');
                    nextTrackRow.innerHTML = `
                        <div class="track-line">${formatText(data.Song)}</div>
                        <div class="track-line">${formatText(data.Orquestra)}</div>
                        <div class="track-line">${formatText(data.Genre)}</div>
                        <div class="track-line">${formatText(data.Year)}</div>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('upcoming-track').innerHTML = 'Error loading data';
                });
        }

        setInterval(fetchData, 5000); // Fetch every 5 seconds
        fetchData(); // Initial fetch

        // Update DJ name display based on the second line of the header textarea
        function updateDjDisplay() {
            const ta = document.getElementById('header-text');
            const disp = document.getElementById('dj-name-display');
            const defaultDj = 'DJ. Murat Karakaya KMK';
            if (!ta || !disp) return;
            const lines = ta.value.split(/\r?\n/);
            // find first non-empty line after the first line
            let djFound = null;
            for (let i = 1; i < lines.length; i++) {
                const t = lines[i].trim();
                if (t) { djFound = t; break; }
            }
            if (!djFound) {
                // fallback: if only one non-empty line exists, keep default
                djFound = defaultDj;
            }
            disp.textContent = djFound;
        }

        const headerTa = document.getElementById('header-text');
        if (headerTa) {
            // auto-resize textarea to content and hide scrollbar
            function autoResizeTextarea(el) {
                el.style.height = 'auto';
                const newHeight = Math.min(el.scrollHeight, parseFloat(getComputedStyle(el).maxHeight));
                el.style.height = newHeight + 'px';
            }

            headerTa.addEventListener('input', () => {
                autoResizeTextarea(headerTa);
                updateDjDisplay();
            });

            // initialize height and display
            autoResizeTextarea(headerTa);
            updateDjDisplay();
        }
    </script>
</body>
</html>
