<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixxx Announcement</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-top: #281d16;
            --bg-bottom: #090909;
            --panel: rgba(20, 12, 7, 0.82);
            --outline: rgba(255, 208, 140, 0.25);
            --title: #ffe3b5;
            --body: #f8efe0;
            --muted: #c9b79a;
            --accent: #ffb347;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--body);
            background:
                radial-gradient(circle at top, rgba(255, 179, 71, 0.22), transparent 36%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        }

        .frame {
            width: min(94vw, 1320px);
            min-height: min(82vh, 960px);
            padding: 3rem;
            border: 1px solid var(--outline);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 24px 90px rgba(0, 0, 0, 0.45);
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(260px, 720px);
            gap: 2rem;
            align-items: center;
            position: relative;
        }

        .content {
            display: grid;
            gap: 1.25rem;
            text-align: left;
            z-index: 1;
        }

        .qr-panel {
            display: grid;
            gap: 1rem;
            justify-items: center;
            padding: 1.25rem;
            border-radius: 24px;
            background: #1a120b;
            color: #f8efe0;
            z-index: 1;
        }

        .qr-code {
            width: min(100%, 640px);
            aspect-ratio: 1;
            border-radius: 20px;
            border: 20px solid #1a120b;
            background: #1a120b;
            overflow: hidden;
            object-fit: cover;
            display: block;
            filter: brightness(0.7) contrast(1.1);
        }

        .qr-caption {
            margin: 0;
            text-align: center;
            font-size: 1rem;
            line-height: 1.5;
            color: #2a2118;
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(8px);
            opacity: 0.55;
        }

        .frame::before {
            width: 180px;
            height: 180px;
            top: -40px;
            right: -30px;
            background: rgba(255, 179, 71, 0.16);
        }

        .frame::after {
            width: 220px;
            height: 220px;
            bottom: -60px;
            left: -40px;
            background: rgba(255, 227, 181, 0.08);
        }

        .eyebrow {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 0.35rem;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 6vw, 5.5rem);
            line-height: 0.95;
            color: var(--title);
        }

        .message {
            margin: 0;
            max-width: 19ch;
            font-size: clamp(1.6rem, 2.4vw, 2.7rem);
            line-height: 1.18;
        }

        .details {
            margin: 0;
            max-width: 32rem;
            font-size: clamp(1.05rem, 1.6vw, 1.45rem);
            line-height: 1.55;
            color: var(--muted);
        }

        .footer {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
            color: var(--muted);
        }

        @media (max-width: 700px) {
            .frame {
                width: 200vw;
                min-height: 200vh;
                border-radius: 0;
                padding: 2rem 1.5rem;
                grid-template-columns: 1fr;
            }

            .content {
                text-align: center;
                justify-items: center;
            }
        }
    </style>
</head>
<body>
    <main class="frame">
        <section class="content">
            <p class="eyebrow">DJ KMK'nın mentorlüğü ve eğitmenliğinde:</p>
            <h1>4. TANGO DJ USTALIK ATÖLYESİ</h1>
            <p class="message">28 Haziran 2026'da AkademiTango'da!</p>
            <p class="details">25 Haziran 2026 Kayıt İçin Son Gündür. </p>
            <p class="footer">Detaylı bilgi ve kayıt için AkademiTango'ya başvurunuz. </p>
        </section>
        <aside class="qr-panel" aria-label="Video area">
            <video class="qr-code" controls autoplay muted loop>
                <source src="djEgitimi.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
            <p class="qr-caption">Detaylı bilgi ve kayıt için AkademiTango'ya başvurunuz.</p>
        </aside>
    </main>
</body>
</html>
